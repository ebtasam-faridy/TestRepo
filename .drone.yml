---
kind: pipeline
type: docker
name: mongodb-service-test

platform:
  os: linux
  arch: arm64

services:
  - name: mongo
    image: mongo:6
    ports:
      - 27017

steps:
  - name: wait-for-mongo
    image: mongo:6
    commands:
      - |
        for i in {1..20}; do
          mongosh --host mongo --eval "db.runCommand({ ping: 1 })" && break
          sleep 2
        done

  - name: build-and-test
    image: golang:1.22
    environment:
      MONGO_URI: mongodb://mongo:27017
    commands:
      - go version
      - go mod tidy
      - go build ./...
      - go test -v ./...
