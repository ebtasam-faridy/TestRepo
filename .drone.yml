---
kind: pipeline
type: docker
name: default

platform:
  os: linux
  arch: arm64
  
steps:
- name: npm-install
  image: node:18
  commands:
  - echo "registry=https://registry.npmjs.org/" > .npmrc
  - echo "@shipt:registry=https://pkg.harness.io/pkg/p7nidaektwegp3qiqixe1a/shipt-npm-prod/npm/" >> .npmrc
  - echo "//pkg.harness.io/pkg/p7nidaektwegp3qiqixe1a/shipt-npm-prod/npm/:_authToken=${CI_NPM_TOKEN}" >> .npmrc
  - npm ci
