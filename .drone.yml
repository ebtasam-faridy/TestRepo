---
kind: pipeline
type: docker
name: mongodb-service-test

platform:
  os: linux
  arch: arm64

services:
  - name: mongo
    image: mongo:6
    command: ["--bind_ip_all"]
    ports:
      - 27017

steps:
  - name: wait-for-mongo
    image: mongo:6
    commands:
      - |
        echo "Waiting for MongoDB to be ready..."
        for i in $(seq 1 40); do
          mongosh --host mongo --eval "db.adminCommand('ping')" >/dev/null 2>&1 && break
          echo "Mongo not ready yet..."
          sleep 3
        done
        echo "Mongo is ready!"

  - name: build-and-test
    image: golang:1.22
    environment:
      MONGO_URI: mongodb://mongo:27017
    commands:
      - go version

      # 🔁 Change version here to repro issue
      - go get github.com/docker/go-units@v0.5.0
      - go mod tidy

      - go build ./...
      - go test -v ./...
