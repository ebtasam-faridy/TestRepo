---
kind: pipeline
type: docker
name: mongodb-service-test

platform:
  os: linux
  arch: arm64

services:
- name: mongodb
  image: mongo:7.0
  resources:
    limits:
      memory: 512m
  environment:
    MONGO_INITDB_ROOT_USERNAME: admin
    MONGO_INITDB_ROOT_PASSWORD: password
  commands:
  - mongod --bind_ip_all

steps:
- name: connect-to-mongodb
  image: mongo:7.0
  commands:
  - echo "Waiting for MongoDB service to be ready..."
  - sleep 10
  - echo "Testing MongoDB connection..."
  - mongosh mongodb://admin:password@mongodb:27017/admin --eval "db.version()"
  - echo "MongoDB connection test successful"
  - echo "Test completed"
