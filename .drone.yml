---
kind: pipeline
type: docker
name: mongodb-service-test

platform:
  os: linux
  arch: arm64

services:
  - name: mongo
    image: mongo:6
    command: ["--bind_ip_all"]
    ports:
      - 27017

steps:
  - name: wait-for-mongo
    image: mongo:6
    commands:
      - |
        echo "Waiting for MongoDB to be ready..."
        for i in $(seq 1 40); do
          mongosh --host mongo --eval "db.adminCommand('ping')" >/dev/null 2>&1 && break
          echo "Mongo not ready yet..."
          sleep 3
        done
        echo "Mongo is ready!"

