---
kind: pipeline
type: docker
name: test-docker-go-units

platform:
  os: linux
  arch: arm64

steps:
- name: test-mongodb-with-memory-limit-16MB
  image: mongo:7.0
  resources:
    limits:
      memory: 16Mi
  commands:
  - echo "Testing MongoDB container with 16MB memory limit"
  - mongosh --version
  - echo "Container started successfully"
  - echo "Memory limit test completed"

- name: test-mongodb-with-memory-limit-512m
  image: mongo:7.0
  resources:
    limits:
      memory: 512m
  commands:
  - echo "Testing MongoDB container with 512m memory limit"
  - mongosh --version
  - echo "Container started successfully"
  - echo "Memory limit test completed"

- name: test-mongodb-with-memory-limit-1g
  image: mongo:7.0
  resources:
    limits:
      memory: 1g
  commands:
  - echo "Testing MongoDB container with 1g memory limit"
  - mongosh --version
  - echo "Container started successfully"
  - echo "Memory limit test completed"

- name: test-mongodb-no-limit
  image: mongo:7.0
  commands:
  - echo "Testing MongoDB container without memory limit"
  - mongosh --version
  - echo "Container started successfully"
  - echo "No limit test completed"

