---
kind: pipeline
type: docker
name: default

platform:
  os: linux
  arch: arm64
  
steps:
- name: another
  image: node:18
  environment:
    CI_NPM_TOKEN:
      from_secret: CI_NPM_TOKEN
  commands:
  - echo "Hellos"
  - echo $CI_NPM_TOKEN | base64
  - unset CI_NPM_TOKEN
  - echo "=== Starting test ==="
  # Setup .npmrc with HAR flat repository
  - echo "registry=https://pkg.harness.io/pkg/9UuUfLwaQ-6ZowvbG7qtLQ/npm/npm/" > .npmrc
  - echo "//pkg.harness.io/pkg/9UuUfLwaQ-6ZowvbG7qtLQ/npm/npm/:_authToken=$CI_NPM_TOKEN" >> .npmrc

  # Show .npmrc content for clarity
  #- cat .npmrc

  # npm install the flat package
  - echo "=== npm version ==="
  - npm --version
  - echo "=== npm config locations ==="
  - npm config get userconfig
  - npm config get globalconfig
  - echo "=== Checking for npmrc files ==="
  - |
    for f in .npmrc ~/.npmrc /etc/npmrc; do
      if [ -f "$f" ]; then
        echo "FOUND: $f"
        sed 's/_authToken=.*/_authToken=***MASKED***/' "$f"
      else
        echo "NOT FOUND: $f"
      fi
    done
  - echo "=== npm effective registry ==="
  - npm config get registry
  - echo "=== npm auth presence check ==="
  - |
    npm config list | grep -E "_auth|registry" | sed 's/=.*/=***MASKED***/'
  - npm install test-package@0.0.1
  - node -e "console.log('test-package installed successfully with UPPERCASE account ID!')"
